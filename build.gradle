plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jvoicexml:freetts:1.2.3'
    implementation 'org.jvoicexml:cmu_us_kal:1.2.3'
    implementation 'org.jvoicexml:cmulex:1.2.3'
    implementation 'org.jvoicexml:en_us:1.2.3'
}

application {
    mainClass = 'Main'
}

